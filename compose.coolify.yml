# Maki on Coolify
#
# Deploy this stack from a Git source with Coolify's "Docker Compose" build pack:
#   Public Repository -> https://github.com/usekaneo/kaneo
#   Build Pack: Docker Compose | Base Directory: / | Compose Location: compose.coolify.yml
#
# Assign a domain to the "maki" service using its container port, e.g. https://maki.example.com:5173
# (visitors use the normal HTTPS URL; the port only tells Coolify where to route traffic).
#
# The only required environment variable is MAKI_CLIENT_URL (your public URL, without :5173).
# AUTH_SECRET and the PostgreSQL password are auto-generated via Coolify magic variables.
# Do NOT set MAKI_API_URL — the entrypoint derives it from MAKI_CLIENT_URL (public URL + /api).
# The Maki image tracks the latest release by default. Set MAKI_IMAGE_TAG to a
# release tag to hold a deployment on a known version.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=maki
      - POSTGRES_USER=maki
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maki -d maki"]
      interval: 10s
      timeout: 5s
      retries: 5

  maki:
    # Tracks the latest release. The API runs database migrations on startup, so
    # set MAKI_IMAGE_TAG to a release tag if a redeploy should stay on a known
    # version rather than pick up whatever is newest.
    image: ghcr.io/usekaneo/kaneo:${MAKI_IMAGE_TAG:-latest}
    environment:
      - MAKI_CLIENT_URL=${MAKI_CLIENT_URL:?}
      - AUTH_SECRET=${SERVICE_HEX_64_MAKI:?}
      # The image derives DATABASE_URL from these POSTGRES_* variables at startup.
      # POSTGRES_PASSWORD is the same generated value shared with the postgres service.
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=maki
      - POSTGRES_USER=maki
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      # Optional: RESEND_*, SSO providers, GitHub integration, Sentry, Redis...
      # add them here or in the Coolify UI for the maki service.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
