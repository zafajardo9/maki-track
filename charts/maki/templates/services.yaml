# Maki Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "maki.fullname" . }}-maki
  labels:
    {{- include "maki.labels" . | nindent 4 }}
    app.kubernetes.io/component: maki
spec:
  type: {{ .Values.maki.service.type }}
  ports:
    - port: {{ .Values.maki.service.port }}
      targetPort: maki
      protocol: TCP
      name: http
  selector:
    {{- include "maki.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: maki

{{- if .Values.postgresql.enabled }}
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "maki.fullname" . }}-postgresql
  labels:
    {{- include "maki.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "maki.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
